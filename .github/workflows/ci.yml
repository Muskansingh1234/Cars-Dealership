name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deploy-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements.txt flake8

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Django system check
        run: |
          python manage.py makemigrations djangoapp --noinput
          python manage.py check

      - name: Apply migrations and load sample data
        run: |
          python manage.py migrate --noinput
          python manage.py seed

      - name: Run unit tests
        run: python manage.py test --verbosity 2

      - name: Smoke-test the running API with curl
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/djangoapp/get_dealers >/dev/null && break; sleep 1; done
          echo "--- get_dealers/Kansas";  curl -sf http://127.0.0.1:8000/djangoapp/get_dealers/Kansas
          echo; echo "--- get_cars";       curl -sf http://127.0.0.1:8000/djangoapp/get_cars
          echo; echo "--- analyze";        curl -sf "http://127.0.0.1:8000/djangoapp/analyze/Fantastic%20services"
          echo; echo "--- About page";     curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/about/
          echo "--- Contact page";         curl -sf -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/contact/

      - name: Build Docker image
        working-directory: .
        run: docker build -t cars-dealership:${{ github.sha }} .

      - name: Workflow summary
        run: echo "CI finished successfully for commit $GITHUB_SHA"
