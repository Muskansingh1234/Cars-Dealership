<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post a review | Cars Dealership</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="/">Cars Dealership</a><nav class="main-nav" aria-label="Main"><a href="/">Home</a><a class="active" href="/dealers/" aria-current="page">Dealers</a><a href="/about/">About Us</a><a href="/contact/">Contact Us</a></nav><div id="auth-area"></div></div></header>
<main class="wrap">
  <div class="panel form-card">
    <h1 id="dealer-title">Post a review</h1>
    <p id="form-message" role="alert"></p>
    <form id="review-form">
      <div class="field"><label for="review">Your review</label>
        <textarea id="review" rows="5" placeholder="Tell other customers about your visit" required></textarea></div>
      <div class="field"><label class="check"><input type="checkbox" id="purchase"> I purchased a car from this dealership</label></div>
      <div id="purchase-fields" hidden>
        <div class="field"><label for="date">Purchase date</label><input id="date" type="date"></div>
        <div class="field"><label for="car">Car make and model</label><select id="car"></select></div>
        <div class="field"><label for="year">Car year</label><input id="year" type="number" min="2015" max="2035" value="2023"></div>
      </div>
      <button type="submit" class="btn">Post review</button>
    </form>
  </div>
</main>
<footer class="site-footer"><div class="wrap">&copy; 2026 Cars Dealership &middot; 1200 Market Street, Wichita, KS 67202 &middot; <a href="mailto:support@carsdealership.example">support@carsdealership.example</a></div></footer>
<script src="/static/js/app.js"></script>
<script src="/static/js/postreview.js"></script>
</body>
</html>
