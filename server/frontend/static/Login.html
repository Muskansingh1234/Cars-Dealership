<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Cars Dealership</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&amp;display=swap">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="/">Cars Dealership</a><nav class="main-nav" aria-label="Main"><a href="/">Home</a><a href="/dealers/">Dealers</a><a href="/about/">About Us</a><a href="/contact/">Contact Us</a></nav><div id="auth-area"></div></div></header>
<main class="wrap">
  <div class="panel form-card">
    <h1>Log in</h1>
    <form id="login-form">
      <div class="field"><label for="userName">Username</label><input id="userName" type="text" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <p id="form-message" class="error" role="alert"></p>
      <button type="submit" class="btn">Log in</button>
      <p class="muted">New here? <a href="/register/">Create an account</a></p>
    </form>
  </div>
</main>
<footer class="site-footer"><div class="wrap">&copy; 2026 Cars Dealership &middot; 1200 Market Street, Wichita, KS 67202 &middot; <a href="mailto:support@carsdealership.example">support@carsdealership.example</a></div></footer>
<script src="/static/js/app.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
